<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bookstore Intelligence - Web Scraping, Retail Analytics, Data-Driven Decisions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1622"/>
      <stop offset="55%" stop-color="#10263A"/>
      <stop offset="100%" stop-color="#14394A"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E6F8C"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
    <linearGradient id="spine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4B66"/>
      <stop offset="100%" stop-color="#2A7391"/>
    </linearGradient>
    <linearGradient id="spine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#153A52"/>
      <stop offset="100%" stop-color="#23607A"/>
    </linearGradient>
    <linearGradient id="spine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B8A9B"/>
      <stop offset="100%" stop-color="#3FB5B0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 700; letter-spacing: 3px; fill: #FFFFFF; }
    .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; letter-spacing: 2px; fill: #7FD6CF; }
    .tag { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; letter-spacing: 4px; fill: #6F8CA0; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3.2s ease-in-out infinite alternate; }
    .b2 { animation-delay: 0.3s; }
    .b3 { animation-delay: 0.6s; }
    .b4 { animation-delay: 0.9s; }
    .b5 { animation-delay: 1.2s; }
    .b6 { animation-delay: 1.5s; }
    @keyframes grow { from { transform: scaleY(0.72); } to { transform: scaleY(1); } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- book spines (left) -->
  <g>
    <rect x="60" y="120" width="34" height="130" rx="3" fill="url(#spine1)"/>
    <rect x="98" y="100" width="30" height="150" rx="3" fill="url(#spine2)"/>
    <rect x="132" y="135" width="38" height="115" rx="3" fill="url(#spine3)"/>
    <rect x="174" y="110" width="30" height="140" rx="3" fill="url(#spine1)"/>
    <rect x="208" y="128" width="34" height="122" rx="3" fill="url(#spine2)"/>
    <line x1="50" y1="250" x2="252" y2="250" stroke="#4FD1C5" stroke-opacity="0.5" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2">
      <line x1="66" y1="140" x2="88" y2="140"/>
      <line x1="104" y1="120" x2="122" y2="120"/>
      <line x1="138" y1="155" x2="164" y2="155"/>
      <line x1="180" y1="130" x2="198" y2="130"/>
      <line x1="214" y1="148" x2="236" y2="148"/>
    </g>
  </g>

  <!-- bar chart (right) -->
  <g>
    <rect class="bar b1" x="900" y="150" width="38" height="100" rx="4" fill="url(#bar)"/>
    <rect class="bar b2" x="948" y="140" width="38" height="110" rx="4" fill="url(#bar)"/>
    <rect class="bar b3" x="996" y="148" width="38" height="102" rx="4" fill="url(#bar)"/>
    <rect class="bar b4" x="1044" y="162" width="38" height="88" rx="4" fill="url(#bar)"/>
    <rect class="bar b5" x="1092" y="140" width="38" height="110" rx="4" fill="url(#bar)"/>
    <line x1="885" y1="250" x2="1145" y2="250" stroke="#4FD1C5" stroke-opacity="0.5" stroke-width="2"/>
    <circle class="pulse" cx="1111" cy="120" r="5" fill="#4FD1C5"/>
  </g>

  <!-- text -->
  <text class="tag" x="600" y="82" text-anchor="middle">PYTHON  |  BEAUTIFULSOUP  |  PANDAS</text>
  <text class="title" x="600" y="145" text-anchor="middle">BOOKSTORE INTELLIGENCE</text>
  <line x1="440" y1="170" x2="760" y2="170" stroke="#4FD1C5" stroke-opacity="0.6" stroke-width="2"/>
  <text class="subtitle" x="600" y="204" text-anchor="middle">Web Scraping  |  Retail Analytics  |  Data-Driven Decisions</text>
</svg>
